# Police Lattice — live source catalog
#
# Every entry below is a public, credential-free endpoint. Nothing here is a
# manual data drop, a seed file, or a simulated response.
#
# `verified` records whether the endpoint was confirmed to return data by a
# direct request during this build (2026-09-03). Entries marked `verified:
# runtime` are real published endpoints that the Verify phase probes on every
# pipeline run; their true status is reported in the UI rather than assumed.
# A source that cannot be reached is reported as unreachable — it is never
# back-filled from another source or from a local file.

defaults:
  timezone: America/Phoenix

sources:
  # ------------------------------------------------------------------
  # City of Phoenix Open Data — CKAN (officer-level accountability data)
  # ------------------------------------------------------------------
  - id: phoenix_ckan_uof
    name: Phoenix PD — Officer Use of Force (current)
    adapter: ckan
    entity_type: use_of_force
    publisher: Phoenix Police Department
    schedule: "10 */4 * * *"
    verified: true
    verified_on: "2026-09-03"
    verified_detail: >-
      GET /api/3/action/datastore_search?resource_id=eddd36ce-c425-4e78-aa40-5dac5367a3b2
      returned HTTP 200 with total=4884 and fields INCIDENT_NUM,
      UNIQUE_INCIDENT_OFFICER, INCIDENT_DATE, EMP_WITHIN_POLICY, EMP_BWC_ACTV.
    config:
      packages: [uof, uof25]

  - id: phoenix_ckan_uof_history
    name: Phoenix PD — Officer Use of Force 2018-01-01 to 2025-02-17
    adapter: ckan
    entity_type: use_of_force
    publisher: Phoenix Police Department
    schedule: "20 3 * * 0"
    verified: runtime
    config:
      packages: [ouof]

  - id: phoenix_ckan_lethal_force
    name: Phoenix PD — Officer-Involved Shootings, Show of Force, Pointed Gun
    adapter: ckan
    entity_type: lethal_force
    publisher: Phoenix Police Department
    schedule: "30 */6 * * *"
    verified: runtime
    config:
      packages: [ois, officer-involved-shooting-ois-incidents, sof, officer-show-of-force, pgp]

  - id: phoenix_ckan_arrests
    name: Phoenix PD — Adult Arrests
    adapter: ckan
    entity_type: arrest
    publisher: Phoenix Police Department
    schedule: "40 */6 * * *"
    verified: true
    verified_on: "2026-09-03"
    verified_detail: >-
      GET /api/3/action/package_show?id=arrests returned HTTP 200; organization
      "police-department"; two datastore-active CSV resources (Adult Arrests
      Details, Adult Arrests Summary).
    config:
      packages: [arrests, d_arrests]

  - id: phoenix_ckan_complaints
    name: City of Phoenix — Complaints, Citations and Liability Claims
    adapter: ckan
    entity_type: complaint
    publisher: City of Phoenix
    schedule: "50 4 * * *"
    verified: runtime
    config:
      packages: [cmpr, risk-management-claims, citations, d_citations]

  - id: phoenix_ckan_officer_demographics
    name: Phoenix PD — Officer Demographics
    adapter: ckan
    entity_type: officer
    publisher: Phoenix Police Department
    schedule: "0 5 1 * *"
    verified: runtime
    config:
      packages: [officer-demographics]

  - id: phoenix_ckan_missing
    name: Phoenix PD — Missing Persons
    adapter: ckan
    entity_type: incident
    publisher: Phoenix Police Department
    schedule: "5 */12 * * *"
    verified: runtime
    config:
      packages: [missing-persons]

  # ------------------------------------------------------------------
  # City of Tempe open data — ArcGIS Hub (DCAT discovery)
  # ------------------------------------------------------------------
  - id: tempe_hub_police
    name: City of Tempe open data — police and incident layers
    adapter: arcgis_hub
    entity_type: incident
    publisher: City of Tempe
    schedule: "15 5 * * *"
    verified: true
    verified_on: "2026-09-03"
    verified_detail: >-
      GET https://data.tempe.gov/api/feed/dcat-us/1.1.json returned HTTP 200
      with a full DCAT catalog; matching items resolve to ArcGIS item ids that
      expose FeatureServer layers.
    config:
      match_terms: [police, incident, arrest, offense, use of force, crash]
      max_layers: 8

  # ------------------------------------------------------------------
  # National public datasets
  # ------------------------------------------------------------------
  - id: wapo_fatal_force
    name: Washington Post — Fatal Force database
    adapter: http_tabular
    entity_type: death
    publisher: The Washington Post
    schedule: "0 6 * * *"
    verified: runtime
    config:
      urls:
        - https://raw.githubusercontent.com/washingtonpost/data-police-shootings/master/fatal-police-shootings-data.csv
      landing_page: https://github.com/washingtonpost/data-police-shootings
      publisher: The Washington Post

  - id: mapping_police_violence
    name: Mapping Police Violence — national dataset
    adapter: http_tabular
    entity_type: death
    publisher: Mapping Police Violence
    schedule: "30 6 * * *"
    verified: runtime
    config:
      urls:
        - https://mappingpoliceviolence.org/s/MPVDatasetDownload.csv
        - https://mappingpoliceviolence.org/mpvdata.csv
      landing_page: https://mappingpoliceviolence.org/data
      publisher: Mapping Police Violence

  # ------------------------------------------------------------------
  # Live news feeds
  # ------------------------------------------------------------------
  - id: news_abc15
    name: ABC15 Phoenix (KNXV)
    adapter: rss
    entity_type: news
    publisher: Scripps Media / KNXV
    schedule: "*/30 * * * *"
    verified: runtime
    config:
      url: https://www.abc15.com/news.rss
      landing_page: https://www.abc15.com/

  - id: news_fox10
    name: FOX 10 Phoenix (KSAZ)
    adapter: rss
    entity_type: news
    publisher: Fox Television Stations
    schedule: "*/30 * * * *"
    verified: runtime
    config:
      url: https://www.fox10phoenix.com/feeds/rss/category/news
      landing_page: https://www.fox10phoenix.com/

  - id: news_ktar
    name: KTAR News 92.3
    adapter: rss
    entity_type: news
    publisher: Bonneville International
    schedule: "*/30 * * * *"
    verified: runtime
    config:
      url: https://ktar.com/feed/
      landing_page: https://ktar.com/

  - id: news_cronkite
    name: Cronkite News (Arizona PBS / ASU)
    adapter: rss
    entity_type: news
    publisher: Walter Cronkite School of Journalism
    schedule: "0 * * * *"
    verified: runtime
    config:
      url: https://cronkitenews.azpbs.org/feed/
      landing_page: https://cronkitenews.azpbs.org/

  - id: news_phoenix_new_times
    name: Phoenix New Times
    adapter: rss
    entity_type: news
    publisher: Voice Media Group
    schedule: "0 * * * *"
    verified: runtime
    config:
      url: https://www.phoenixnewtimes.com/phoenix/Rss.xml
      landing_page: https://www.phoenixnewtimes.com/

  - id: news_az_free_news
    name: AZ Free News
    adapter: rss
    entity_type: news
    publisher: AZ Free News
    schedule: "0 */2 * * *"
    verified: runtime
    config:
      url: https://azfreenews.com/feed/
      landing_page: https://azfreenews.com/

  - id: news_propublica
    name: ProPublica — national investigations
    adapter: rss
    entity_type: news
    publisher: ProPublica
    schedule: "0 */3 * * *"
    verified: runtime
    config:
      url: https://www.propublica.org/feeds/propublica/main
      landing_page: https://www.propublica.org/
