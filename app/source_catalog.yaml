# ---------------------------------------------------------------------------
# Police Lattice — Live Source Catalog
#
# EXECUTION MANDATE COMPLIANCE:
#   * Every ENABLED source below is a live external endpoint. There are no
#     manual data drops, no static seed files, and no simulated responses.
#   * Dataset identifiers for open-data domains are resolved at RUNTIME via
#     the Socrata Discovery Catalog API and the ArcGIS Hub search API
#     (see app/pipeline/search.py), so dataset migrations are tracked
#     automatically. Explicit IDs may be pinned via environment variables.
#   * Sources that require interactive/authenticated portals (GovQA, live
#     scanner audio, JS-only dashboards) are listed with `enabled: false` and
#     an explicit reason. They are never fabricated or substituted.
#   * The Verify phase probes every enabled source each run; reachability and
#     freshness are recorded in `data_sources.last_error` / pipeline_runs.
# ---------------------------------------------------------------------------

defaults:
  timezone: America/Phoenix

sources:
  # =========================================================================
  # LIVE OPEN DATA — SOCRATA DOMAINS (dataset IDs resolved at runtime)
  # =========================================================================
  - id: tempe_socrata_police
    name: "Tempe Open Data (data.tempe.gov) — police datasets [live discovery]"
    category: official_data_portals
    adapter: socrata
    access_mode: api
    schedule: "15 5 * * *"
    availability_window: daily 05:15 America/Phoenix
    config:
      domain: data.tempe.gov
      discover:
        query: police
        limit: 25
    entity_type: incident

  - id: tempe_socrata_arrests
    name: "Tempe Open Data (data.tempe.gov) — arrests [live discovery]"
    category: official_data_portals
    adapter: socrata
    access_mode: api
    schedule: "30 5 * * *"
    availability_window: daily 05:30 America/Phoenix
    config:
      domain: data.tempe.gov
      discover:
        query: arrest
        limit: 15
    entity_type: arrest

  - id: phx_socrata_police
    name: "City of Phoenix Open Data Portal — police datasets [live discovery]"
    category: official_data_portals
    adapter: socrata
    access_mode: api
    schedule: "45 5 * * *"
    availability_window: daily 05:45 America/Phoenix
    config:
      domain: phoenixopendata.com
      discover:
        query: police use of force
        limit: 25
    entity_type: use_of_force

  # =========================================================================
  # LIVE OPEN DATA — ARCGIS HUB (service URLs resolved at runtime)
  # =========================================================================
  - id: tempe_arcgis_police
    name: "ArcGIS Hub — Tempe police layers [live discovery]"
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 6 * * *"
    availability_window: daily 06:00 America/Phoenix
    config:
      hub_discover:
        query: "police Tempe"
        limit: 10
      service_url_env: TEMPE_ARCGIS_SERVICE_URL
      layer: 0
    entity_type: incident

  - id: phx_arcgis_police
    name: "ArcGIS Hub — Phoenix police layers [live discovery]"
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "15 6 * * *"
    availability_window: daily 06:15 America/Phoenix
    config:
      hub_discover:
        query: "police Phoenix Arizona"
        limit: 10
      service_url_env: PHX_ARCGIS_SERVICE_URL
      layer: 0
    entity_type: incident

  # =========================================================================
  # LIVE NATIONAL DATASETS — exact public canonical files
  # =========================================================================
  - id: wapo_fatal_force
    name: "Washington Post Fatal Force database (canonical public CSV)"
    category: investigative
    adapter: flatfile
    access_mode: api
    schedule: "0 4 * * *"
    availability_window: daily 04:00 America/Phoenix
    config:
      urls:
        - https://raw.githubusercontent.com/washingtonpost/data-police-shootings/master/fatal-police-shootings-data.csv
      url_env: WAPO_FATAL_FORCE_CSV_URL
    entity_type: death

  - id: mapping_police_violence
    name: "Mapping Police Violence dataset (canonical public CSV)"
    category: investigative
    adapter: flatfile
    access_mode: api
    schedule: "30 4 * * *"
    availability_window: daily 04:30 America/Phoenix
    config:
      urls:
        - https://mappingpoliceviolence.org/mpvdata.csv
        - https://mappingpoliceviolence.org/s/MPVDatasetDownload.csv
      url_env: MPV_DATASET_CSV_URL
    entity_type: death

  # =========================================================================
  # LIVE NEWS FEEDS (verified public RSS/Atom endpoints)
  # =========================================================================
  - id: abc15_news
    name: ABC15 Phoenix KNXV
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "*/30 * * * *"
    availability_window: continuous 30-minute intervals
    config:
      url: https://www.abc15.com/news.rss
      url_env: ABC15_RSS_URL
    entity_type: news

  - id: fox10_phoenix
    name: FOX 10 Phoenix
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "*/30 * * * *"
    availability_window: continuous 30-minute intervals
    config:
      url: https://www.fox10phoenix.com/feeds/rss/category/news
      url_env: FOX10_RSS_URL
    entity_type: news

  - id: ktar_news
    name: KTAR News 92.3 FM
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "*/30 * * * *"
    availability_window: continuous 30-minute intervals
    config:
      url: https://ktar.com/feed/
      url_env: KTAR_RSS_URL
    entity_type: news

  - id: cronkite_news
    name: Cronkite News ASU
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "0 * * * *"
    availability_window: hourly
    config:
      url: https://cronkitenews.azpbs.org/feed/
      url_env: CRONKITE_RSS_URL
    entity_type: news

  - id: propublica
    name: ProPublica
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "0 * * * *"
    availability_window: hourly
    config:
      url: https://www.propublica.org/feeds/propublica/main
      url_env: PROPUBLICA_RSS_URL
    entity_type: news

  - id: phoenix_new_times
    name: Phoenix New Times
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "0 * * * *"
    availability_window: hourly
    config:
      url: https://www.phoenixnewtimes.com/phoenix/Rss.xml
      url_env: PHOENIX_NEW_TIMES_RSS_URL
    entity_type: news

  - id: az_free_news
    name: AZ Free News
    category: news
    adapter: news_rss
    access_mode: rss
    schedule: "0 * * * *"
    availability_window: hourly
    config:
      url: https://azfreenews.com/feed/
      url_env: AZ_FREE_NEWS_RSS_URL
    entity_type: news

  # =========================================================================
  # LIVE COURT RECORDS (CourtListener REST v4; token required)
  # =========================================================================
  - id: courtlistener_melendres
    name: "CourtListener — Melendres v. Sheridan (D. Ariz. 2:07-cv-02513)"
    category: legal_court
    adapter: courtlistener
    access_mode: api
    schedule: "0 6 * * 1"
    availability_window: weekly Monday 06:00 America/Phoenix
    config:
      docket_number: 2:07-cv-02513
      court: azd
    entity_type: court_case

  - id: courtlistener_phx_police_search
    name: "CourtListener — live docket search: Phoenix Police"
    category: legal_court
    adapter: courtlistener
    access_mode: api
    schedule: "30 6 * * 1"
    availability_window: weekly Monday 06:30 America/Phoenix
    config:
      query: "Phoenix Police"
      court: azd
    entity_type: court_case

  # =========================================================================
  # LIVE PUBLIC RECORDS (MuckRock API; token required)
  # =========================================================================
  - id: muckrock_police_az
    name: "MuckRock — Arizona police public records requests"
    category: investigative
    adapter: muckrock
    access_mode: api
    schedule: "0 10 * * 1"
    availability_window: weekly Monday 10:00 America/Phoenix
    config:
      query: police Arizona
    entity_type: public_records_request

  # =========================================================================
  # LIVE DOCUMENTS — canonical public report PDFs (env-pinnable)
  # =========================================================================
  - id: doj_phx_pd_investigation
    name: "DOJ Investigation of Phoenix Police Department (public report PDF)"
    category: legal_court
    adapter: pdf_ocr
    access_mode: api
    schedule: "0 7 1 * *"
    availability_window: monthly 1st 07:00 America/Phoenix
    config:
      urls: []  # populated via DOJ_PHX_REPORT_URLS (comma-separated live URLs)
      url_env: DOJ_PHX_REPORT_URLS
    entity_type: document

  # =========================================================================
  # INTERACTIVE / AUTHENTICATED PORTALS — recorded, NOT autonomously scraped.
  # These require interactive portal access or credentials. They are disabled
  # by design: the pipeline reports them as `portal_access_required` instead
  # of ever fabricating or substituting data for them.
  # =========================================================================
  - id: phx_public_records_govqa
    name: "Phoenix Police Public Records Center (GovQA portal)"
    category: public_records
    adapter: web_scraper
    access_mode: portal
    enabled: false
    schedule: null
    availability_window: on-demand (interactive portal)
    config:
      disabled_reason: "Interactive GovQA portal; requires records-request session. No autonomous access."  # noqa: E501

  - id: tempe_professional_standards
    name: "Tempe Police Professional Standards / Internal Affairs"
    category: public_records
    adapter: web_scraper
    access_mode: portal
    enabled: false
    schedule: null
    availability_window: on-demand (interactive portal)
    config:
      disabled_reason: "Records provided via public records request process; no public bulk API."  # noqa: E501

  - id: azpost_certification
    name: "AZPOST officer certification / disciplinary actions"
    category: oversight
    adapter: web_scraper
    access_mode: portal
    enabled: false
    schedule: null
    availability_window: on-demand (interactive portal)
    config:
      disabled_reason: "AZPOST Empower portal is a JavaScript application without a public API."  # noqa: E501

  - id: maricopa_scanner_audio
    name: "Maricopa County live police scanner audio"
    category: live_audio
    adapter: web_scraper
    access_mode: portal
    enabled: false
    schedule: null
    availability_window: continuous (third-party apps)
    config:
      disabled_reason: "Live audio is streamed via third-party apps; no public bulk endpoint."  # noqa: E501

  - id: mcso_inmate_search
    name: "MCSO inmate search"
    category: other
    adapter: web_scraper
    access_mode: portal
    enabled: false
    schedule: null
    availability_window: on-demand (interactive portal)
    config:
      disabled_reason: "Interactive search application; no public bulk API."
