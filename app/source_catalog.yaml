defaults:
  timezone: America/Phoenix
  access_mode: manual
  schedule: null

sources:
  # =============================
  # OFFICIAL DATA PORTALS & APIs
  # =============================
  - id: tempe_pd_hub
    name: Tempe Police Data Hub
    category: official_data_portals
    adapter: web_scraper
    access_mode: manual
    schedule: null
    availability_window: on-demand
    config: {}

  - id: tempe_pd_calls
    name: Tempe Police Calls for Service Dataset
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 6 * * *"
    availability_window: daily 06:00-07:00 America/Phoenix
    config:
      service_url_env: TEMPE_CALLS_FOR_SERVICE_URL
      layer: 0
      out_fields: "*"
    entity_type: incident

  - id: tempe_pd_calls_90day
    name: Tempe Police Calls for Service (90-Day View)
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "30 6 * * *"
    availability_window: daily 06:30-07:30 America/Phoenix
    config:
      service_url_env: TEMPE_CALLS_FOR_SERVICE_URL
      layer: 0
      where: "1=1"
    entity_type: incident

  - id: tempe_pd_calls_data_dict
    name: Tempe Police Calls for Service Data Dictionary
    category: official_data_portals
    adapter: web_scraper
    access_mode: manual
    schedule: null
    availability_window: on-demand
    config: {}

  - id: tempe_pd_general_offense
    name: Tempe Police General Offense Dataset
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 7 * * *"
    availability_window: daily 07:00-08:00 America/Phoenix
    config:
      service_url_env: TEMPE_GENERAL_OFFENSE_URL
      layer: 0
    entity_type: incident

  - id: tempe_pd_arrests
    name: Tempe Arrests Datasets
    category: official_data_portals
    adapter: flatfile
    access_mode: file_drop
    schedule: "0 8 * * *"
    availability_window: daily 08:00-09:00 America/Phoenix
    config:
      drop_dir_env: MANUAL_DROP_DIR
      filename_pattern: "*arrest*.csv"
    entity_type: arrest

  - id: tempe_pd_sentiment_survey
    name: Tempe Police Sentiment Survey Data
    category: official_data_portals
    adapter: generic_rest
    access_mode: api
    schedule: "0 6 1 * *"
    availability_window: monthly first day 06:00 America/Phoenix
    config:
      url_env: TEMPE_SENTIMENT_SURVEY_URL
      pagination: none
    entity_type: sentiment_survey

  - id: tempe_pd_hate_crime
    name: Tempe Police Hate Crime Incident Dataset
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 9 * * *"
    availability_window: daily 09:00-10:00 America/Phoenix
    config:
      service_url_env: TEMPE_HATE_CRIME_URL
      layer: 0
    entity_type: incident

  - id: phx_police_crime_grid
    name: Phoenix Police Crime Grid
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 2 * * 0"
    availability_window: weekly Sunday 02:00 America/Phoenix
    config:
      service_url_env: PHX_CRIME_GRID_URL
      layer: 0
    entity_type: geography

  - id: phx_police_stations
    name: Phoenix Police Station Locations
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 3 * * 0"
    availability_window: weekly Sunday 03:00 America/Phoenix
    config:
      service_url_env: PHX_STATION_URL
      layer: 0
    entity_type: facility

  - id: phx_police_beats
    name: Phoenix Police Beats
    category: official_data_portals
    adapter: arcgis
    access_mode: api
    schedule: "0 4 * * 0"
    availability_window: weekly Sunday 04:00 America/Phoenix
    config:
      service_url_env: PHX_BEATS_URL
      layer: 0
    entity_type: geography

  - id: phx_police_public_records_portal
    name: Phoenix Police Public Records Portal
    category: official_data_portals
    adapter: public_records
    access_mode: portal
    schedule: null
    availability_window: on-demand
    config: {}

  - id: opd_phx_calls
    name: OpenPoliceData Phoenix Calls for Service 2025
    category: official_data_portals
    adapter: opd
    access_mode: api
    schedule: "0 5 * * *"
    availability_window: daily 05:00 America/Phoenix
    config: {}
    entity_type: incident

  - id: az_dps
    name: Arizona Department of Public Safety Criminal History
