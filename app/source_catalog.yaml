    access_mode: manual
    schedule: null
    availability_window: on-demand
    config: {}

  - id: city_of_phx_open_data_portal
    name: City of Phoenix Open Data Portal
    category: official_data_portals
    adapter: socrata
    access_mode: api
    schedule: "0 5 * * *"
    availability_window: daily 05:00 America/Phoenix
    config:
      domain_env: PHX_OPEN_DATA_PORTAL_DOMAIN
      dataset_ids:
        - PHX_UOF_DATASET_ID
        - PHX_OIS_DATASET_ID
        - PHX_PGP_DATASET_ID
        - PHX_SOF_DATASET_ID
