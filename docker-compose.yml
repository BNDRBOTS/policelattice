version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: lattice
      POSTGRES_DB: police_lattice
    ports:
      - "5432:5432"
    volumes:
      - lattice_db:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the 'db' service instead of localhost
      DATABASE_URL: postgresql+psycopg2://lattice:lattice@db:5432/police_lattice
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  lattice_db:
