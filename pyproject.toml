[tool.poetry]
name = "police-lattice"
version = "0.1.0"
description = "Topological ingestion and synthesis lattice for police accountability data"
authors = ["Architect"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.1"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
feedparser = "^6.0.10"
pytesseract = "^0.3.10"
Pillow = "^10.2.0"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
apscheduler = "^3.10.4"
tenacity = "^8.2.3"
pandas = "^2.2.0"
openpyxl = "^3.1.2"
python-multipart = "^0.0.9"
httpx = "^0.26.0"

# Best-in-class parsers & retrieval (benchmark-validated selections)
orjson = "^3.10"           # fastest RFC-compliant JSON (Rust)
lxml = "^5.1"              # fastest production HTML/XML engine (libxml2)
pypdfium2 = "^4.30"        # PDFium PDF text extraction (fastest permissive)
bm25s = "^0.2"             # fastest Lucene-grade BM25
fastembed = "^0.3"         # ONNX BGE-small embeddings (top MTEB small, CPU)
rapidfuzz = "^3.6"         # benchmark-standard C++ literal/fuzzy matching
scipy = "^1.12"            # reference statistics (exact Poisson tests)
numpy = "^1.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["B008"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
