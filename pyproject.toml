[tool.poetry]
name = "police-lattice"
version = "3.0.0"
description = "Autonomous acquisition, verification and synthesis of public police accountability records"
authors = ["Police Lattice"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# --- web / api ---
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# --- persistence ---
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.10"

# --- transport ---
httpx = {version = "^0.27.2", extras = ["http2"]}
tenacity = "^9.0.0"

# --- best-in-class parsers (see app/ingest/parsers.py for the benchmark rationale) ---
orjson = "^3.10.0"          # fastest Python JSON codec
polars = "^1.12.0"          # fastest CSV scanner
python-calamine = "^0.3.0"  # fastest xlsx reader (engine polars/pandas select)
selectolax = "^0.3.24"      # lexbor HTML parser
feedparser = "^6.0.11"      # reference RSS/Atom parser
pypdfium2 = "^4.30.0"       # PDFium text extraction
python-dateutil = "^2.9.0"
pyyaml = "^6.0.2"

# --- best-in-class retrieval ---
bm25s = "^0.3.0"            # fastest Python BM25
numpy = ">=1.26,<3"
scipy = "^1.14.0"
fastembed = "^0.8.0"        # ONNX dense embeddings, CPU

# --- scheduling ---
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B905"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
